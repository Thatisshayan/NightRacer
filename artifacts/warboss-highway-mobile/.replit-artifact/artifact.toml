kind = "mobile"
previewPath = "/warboss-highway-mobile/"
title = "Warboss Highway Mobile"
version = "1.0.0"
id = "artifacts/warboss-highway-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/warboss-highway-mobile/" ]
localPort = 22603

[services.development]
run = "pnpm --filter @workspace/warboss-highway-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/warboss-highway-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/warboss-highway-mobile", "run", "serve" ]

[services.env]
PORT = "22603"
BASE_PATH = "/warboss-highway-mobile/"
