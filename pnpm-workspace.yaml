# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. Replit packsges, react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  # Exclude @replit scoped packages from the minimum release age check.
  # These are published by Replit and trusted — the supply-chain attack vector
  # this setting guards against does not apply to our own packages.
  - '@replit/*'
  - stripe-replit-sync

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.21
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  # Must track the `react`/`react-dom` pin below (19.1.0) — letting these
  # drift to a newer major/minor than the actual runtime resolves two
  # incompatible @types/react-dom builds across the workspace (one paired
  # with @types/react@19.1.x, one with @types/react@19.2.x), which surfaces
  # as spurious "two different types ... are unrelated" TS errors on any
  # component using polymorphic refs/props (e.g. @radix-ui/react-slot,
  # react-day-picker).
  '@types/react': ^19.1.0
  '@types/react-dom': ^19.1.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because expo requires it
  react: 19.1.0
  # Must be this exact version because expo requires it
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

# Replit deploys on linux-x64; local dev happens on win32-x64. Restricting
# supported architectures (rather than hand-listing every "-" override per
# native package) is pnpm's built-in mechanism for exactly this: it prunes
# optional-dependency binaries for every package at once, so adding a new
# native dep later can't silently reintroduce a platform-specific breakage
# the way the old per-package override blocklist did.
supportedArchitectures:
  os:
    - linux
    - win32
  cpu:
    - x64

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
  # expo-three -> @expo/browser-polyfill -> fbemitter -> fbjs -> isomorphic-fetch
  # pulls in node-fetch@1.7.3, vulnerable to CVE-2022-0235. fbjs's own fetch
  # polyfill path isn't reachable in this app (expo-three only uses
  # @expo/browser-polyfill for Canvas/WebGL shims, not its fetch fallback),
  # but pin isomorphic-fetch's node-fetch to a patched version regardless.
  "isomorphic-fetch>node-fetch": "^2.6.7"

allowBuilds:
  esbuild: true
