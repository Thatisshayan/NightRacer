name: ios-build

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/warboss-highway-mobile/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'artifacts/warboss-highway-mobile/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    name: build (expo prebuild + xcodebuild, no EAS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: artifacts/warboss-highway-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (workspace root)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Prebuild native iOS project
        # --no-install: pnpm already installed workspace deps above; expo's own
        # installer doesn't know about pnpm workspaces.
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: Import signing certificate + provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/dist_cert.p12"
          security import "$RUNNER_TEMP/dist_cert.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DIST_CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/warboss-highway.mobileprovision"

      - name: Archive (xcodebuild, no EAS/Fastlane)
        # Emitted by `expo prebuild` from app.json's `name`/`slug` — if this
        # workspace/scheme name is wrong, `xcodebuild -list` in the failure
        # logs will show the actual names to fix this with.
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/warbosshighway.xcworkspace \
            -scheme warbosshighway \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/WarbossHighway.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Warboss Highway App Store" \
            archive

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WarbossHighway.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarbossHighway-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      # Only ship to TestFlight from main - PRs just prove the archive/export
      # succeeds, so every PR doesn't spam a new TestFlight build. Re-exports
      # with destination=upload rather than reusing altool (legacy, being
      # phased out) - xcodebuild handles the upload itself when given the API
      # key directly, no separate key-file-lookup path convention to get wrong.
      - name: Export + upload to TestFlight
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"

          cat > "$RUNNER_TEMP/exportOptionsUpload.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>destination</key><string>upload</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/WarbossHighway.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptionsUpload.plist" \
            -exportPath "$RUNNER_TEMP/export-upload" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
